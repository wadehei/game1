name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  frontend:
    name: Frontend（lint · typecheck · test · build）
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: children-games-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: children-games-frontend

      - name: Run linter
        run: npm run lint:check
        working-directory: children-games-frontend

      - name: Run TypeScript check
        run: npm run typecheck
        working-directory: children-games-frontend

      - name: Run unit tests
        run: npm run test:run
        working-directory: children-games-frontend

      - name: Build
        run: npm run build
        working-directory: children-games-frontend

  backend:
    name: Backend（lint · build · test）
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: children-games-backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: children-games-backend

      - name: Run linter
        run: npm run lint:check
        working-directory: children-games-backend

      - name: Build
        run: npm run build
        working-directory: children-games-backend

      - name: Run unit tests
        run: npm test
        working-directory: children-games-backend
