name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-shared:
    name: Build Shared Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: packages/shared/package.json

      - name: Install dependencies
        run: npm ci
        working-directory: packages/shared

      - name: Build shared package
        run: npm run build
        working-directory: packages/shared

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shared-dist
          path: packages/shared/dist/
          retention-days: 1

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: build-shared
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: children-games-frontend/package.json

      - name: Download shared package
        uses: actions/download-artifact@v4
        with:
          name: shared-dist
          path: packages/shared/dist/

      - name: Install dependencies
        run: npm ci
        working-directory: children-games-frontend

      - name: Run linter
        run: npm run lint:check
        working-directory: children-games-frontend

      - name: Run TypeScript check
        run: npm run typecheck
        working-directory: children-games-frontend

      - name: Run tests
        run: npm run test:run
        working-directory: children-games-frontend

      - name: Run tests with coverage
        run: npm run test:coverage
        working-directory: children-games-frontend

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./children-games-frontend/coverage/coverage-final.json
          flags: frontend
          fail_ci_if_error: false
        if: matrix.node-version == '20.x'

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: build-shared
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: children-games-backend/package.json

      - name: Download shared package
        uses: actions/download-artifact@v4
        with:
          name: shared-dist
          path: packages/shared/dist/

      - name: Install dependencies
        run: npm ci
        working-directory: children-games-backend

      - name: Run linter
        run: npm run lint:check
        working-directory: children-games-backend

      - name: Run TypeScript check
        run: npx tsc --noEmit
        working-directory: children-games-backend

      - name: Run tests
        run: npm run test
        working-directory: children-games-backend

      - name: Run tests with coverage
        run: npm run test:coverage
        working-directory: children-games-backend

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./children-games-backend/coverage/coverage-final.json
          flags: backend
          fail_ci_if_error: false
        if: matrix.node-version == '20.x'

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [frontend-test, backend-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Download shared package
        uses: actions/download-artifact@v4
        with:
          name: shared-dist
          path: packages/shared/dist/

      - name: Build frontend
        run: npm ci && npm run build
        working-directory: children-games-frontend

      - name: Build backend
        run: npm ci && npm run build
        working-directory: children-games-backend

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: children-games-frontend/dist/
          retention-days: 7

      - name: Upload backend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: children-games-backend/dist/
          retention-days: 7
