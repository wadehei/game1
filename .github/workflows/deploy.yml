name: Deploy

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Build shared package
        run: npm ci && npm run build
        working-directory: packages/shared

      - name: Build frontend
        run: npm ci && npm run build
        working-directory: children-games-frontend

      - name: Build backend
        run: npm ci && npm run build
        working-directory: children-games-backend

      - name: Deploy frontend via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: 'children-games-frontend/dist/*'
          target: ${{ secrets.FRONTEND_PATH }}
          strip_components: 2
          overwrite: true
          rm: true

      - name: Deploy backend via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: 'children-games-backend/dist/*'
          target: ${{ secrets.BACKEND_PATH }}
          strip_components: 2
          overwrite: true

      - name: Sync backend dependencies
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: 'children-games-backend/package.json,children-games-backend/package-lock.json'
          target: ${{ secrets.BACKEND_PATH }}/..
          strip_components: 1
          overwrite: true

      - name: Restart backend service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd ${{ secrets.BACKEND_PATH }}/..
            npm install --omit=dev --no-audit --no-fund --loglevel=error
            pm2 restart ${{ secrets.PM2_APP_NAME }}
            pm2 ls

      - name: Deployment summary
        run: |
          echo "## 🚀 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployed Components" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Frontend (static files)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Backend (Node.js API)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Dependencies synced" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ PM2 service restarted" >> $GITHUB_STEP_SUMMARY
