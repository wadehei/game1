<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>离线模式 - 儿童游戏乐园</title>
  <style>
    /* Simple offline page styling matching the app's theme */
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      text-align: center;
    }
    .container {
      padding: 2rem;
    }
    h1 { font-size: 2rem; margin-bottom: 1rem; }
    p { font-size: 1.2rem; opacity: 0.9; }
    .emoji { font-size: 4rem; margin-bottom: 1rem; }
    button {
      margin-top: 1.5rem;
      padding: 0.75rem 2rem;
      font-size: 1rem;
      border: 2px solid white;
      border-radius: 2rem;
      background: transparent;
      color: white;
      cursor: pointer;
      transition: all 0.3s;
    }
    button:hover {
      background: white;
      color: #667eea;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="emoji">📡</div>
    <h1>哎呀，断网了！</h1>
    <p>请检查网络连接后重试</p>
    <button onclick="window.location.reload()">重新连接</button>
  </div>
</body>
</html>
