<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 60">
  <!-- Cloud with 3 bumps -->
  <ellipse cx="30" cy="35" rx="25" ry="18" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="2"/>
  <ellipse cx="55" cy="30" rx="30" ry="22" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="2"/>
  <ellipse cx="85" cy="35" rx="28" ry="18" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="2"/>

  <!-- Fill overlaps to make it one cloud -->
  <ellipse cx="42" cy="32" rx="20" ry="18" fill="#FFFFFF"/>
  <ellipse cx="70" cy="32" rx="22" ry="18" fill="#FFFFFF"/>

  <!-- Subtle inner highlight -->
  <ellipse cx="50" cy="28" rx="15" ry="10" fill="rgba(240,248,255,0.8)"/>
  <ellipse cx="75" cy="30" rx="12" ry="8" fill="rgba(240,248,255,0.8)"/>
</svg>
