<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60">
  <!-- Bomb body -->
  <circle cx="30" cy="35" r="22" fill="#2C3E50" stroke="#333" stroke-width="2.5"/>

  <!-- Highlight -->
  <ellipse cx="22" cy="28" rx="8" ry="9" fill="rgba(255,255,255,0.15)"/>

  <!-- Fuse -->
  <path d="M 42 22 Q 48 18 50 12" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

  <!-- Spark/Star at fuse tip -->
  <path d="M 50 12 L 52 10 M 50 12 L 52 14 M 50 12 L 48 10 M 50 12 L 48 14 M 50 12 L 53 12 M 50 12 L 47 12"
        stroke="#FF6B35" stroke-width="2" stroke-linecap="round"/>
  <circle cx="50" cy="12" r="3" fill="#FFE66D"/>

  <!-- X Eyes -->
  <path d="M 22 30 L 26 34 M 26 30 L 22 34" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 34 30 L 38 34 M 38 30 L 34 34" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Frown -->
  <path d="M 22 42 Q 30 38 38 42" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
</svg>
