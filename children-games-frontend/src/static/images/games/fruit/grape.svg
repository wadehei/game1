<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60">
  <!-- Grape cluster -->
  <circle cx="30" cy="30" r="10" fill="#9B59B6" stroke="#333" stroke-width="2"/>
  <circle cx="22" cy="28" r="9" fill="#9B59B6" stroke="#333" stroke-width="2"/>
  <circle cx="38" cy="28" r="9" fill="#9B59B6" stroke="#333" stroke-width="2"/>
  <circle cx="26" cy="38" r="9" fill="#9B59B6" stroke="#333" stroke-width="2"/>
  <circle cx="34" cy="38" r="9" fill="#9B59B6" stroke="#333" stroke-width="2"/>
  <circle cx="30" cy="44" r="8" fill="#9B59B6" stroke="#333" stroke-width="2"/>

  <!-- Highlights -->
  <circle cx="27" cy="27" r="3" fill="rgba(255,255,255,0.4)"/>
  <circle cx="35" cy="27" r="3" fill="rgba(255,255,255,0.4)"/>
  <circle cx="23" cy="35" r="3" fill="rgba(255,255,255,0.4)"/>

  <!-- Stem -->
  <path d="M 30 22 L 30 12" stroke="#8B4513" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Leaf -->
  <ellipse cx="35" cy="14" rx="7" ry="5" fill="#2ECC71" stroke="#333" stroke-width="2"/>

  <!-- Eyes (on center grape) -->
  <circle cx="27" cy="30" r="2" fill="#333"/>
  <circle cx="33" cy="30" r="2" fill="#333"/>

  <!-- Smile -->
  <path d="M 27 35 Q 30 37 33 35" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round"/>
</svg>
