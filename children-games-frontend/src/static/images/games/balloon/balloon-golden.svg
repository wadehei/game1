<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 120">
  <!-- Balloon body -->
  <ellipse cx="40" cy="42" rx="30" ry="36" fill="#FFD700" stroke="#333" stroke-width="2.5"/>

  <!-- Highlight arc -->
  <path d="M 25 30 Q 22 38 25 48" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="5" stroke-linecap="round"/>

  <!-- Star emblem on balloon -->
  <path d="M 40 32 L 43 39 L 50 39 L 44 44 L 46 51 L 40 47 L 34 51 L 36 44 L 30 39 L 37 39 Z"
        fill="#FFF8DC" stroke="#DAA520" stroke-width="1.5"/>

  <!-- Sparkle marks around balloon -->
  <path d="M 15 25 L 18 28 M 18 25 L 15 28" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
  <path d="M 62 30 L 65 33 M 65 30 L 62 33" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
  <path d="M 12 50 L 15 53 M 15 50 L 12 53" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
  <path d="M 65 55 L 68 58 M 68 55 L 65 58" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>

  <!-- Eyes -->
  <circle cx="32" cy="42" r="2.5" fill="#333"/>
  <circle cx="48" cy="42" r="2.5" fill="#333"/>

  <!-- Smile -->
  <path d="M 32 52 Q 40 57 48 52" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Knot -->
  <path d="M 36 76 L 40 82 L 44 76 Z" fill="#FFD700" stroke="#333" stroke-width="2"/>

  <!-- String -->
  <path d="M 40 82 Q 38 95 42 105 Q 44 112 40 118" fill="none" stroke="#666" stroke-width="2" stroke-linecap="round"/>
</svg>
