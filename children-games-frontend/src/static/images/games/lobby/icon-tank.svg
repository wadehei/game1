<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60">
  <!-- Star above tank -->
  <polygon points="30,2 33,10 41,10 35,15 37,23 30,19 23,23 25,15 19,10 27,10" fill="#FFD700" stroke="#E6AC00" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Star inner highlight -->
  <circle cx="29" cy="12" r="2" fill="white" opacity="0.3"/>
  <!-- Tank body -->
  <rect x="12" y="38" width="36" height="16" rx="4" fill="#556B2F" stroke="#333" stroke-width="2"/>
  <!-- Tank track left -->
  <rect x="8" y="40" width="8" height="14" rx="4" fill="#3E4F22" stroke="#333" stroke-width="1.5"/>
  <!-- Tank track right -->
  <rect x="44" y="40" width="8" height="14" rx="4" fill="#3E4F22" stroke="#333" stroke-width="1.5"/>
  <!-- Tank turret -->
  <circle cx="30" cy="38" r="10" fill="#6B8E23" stroke="#333" stroke-width="2"/>
  <!-- Tank cannon -->
  <rect x="27" y="26" width="6" height="14" rx="2" fill="#4A5F28" stroke="#333" stroke-width="1.5"/>
  <circle cx="30" cy="26" r="3" fill="#3E4F22" stroke="#333" stroke-width="1"/>
</svg>
