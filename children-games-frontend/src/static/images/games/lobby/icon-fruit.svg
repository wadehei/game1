<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60">
  <!-- Basket body -->
  <path d="M12 38 L16 54 L44 54 L48 38 Z" fill="#8B6914" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- Basket rim -->
  <rect x="10" y="35" width="40" height="5" rx="2" fill="#A0782C" stroke="#333" stroke-width="2"/>
  <!-- Basket handle -->
  <path d="M18 35 Q30 22 42 35" fill="none" stroke="#A0782C" stroke-width="3" stroke-linecap="round"/>
  <path d="M18 35 Q30 22 42 35" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <!-- Basket weave lines -->
  <line x1="20" y1="40" x2="22" y2="52" stroke="#6D5010" stroke-width="1" opacity="0.5"/>
  <line x1="30" y1="40" x2="30" y2="52" stroke="#6D5010" stroke-width="1" opacity="0.5"/>
  <line x1="40" y1="40" x2="38" y2="52" stroke="#6D5010" stroke-width="1" opacity="0.5"/>
  <!-- Apple (floating above basket) -->
  <circle cx="30" cy="18" r="12" fill="#FF3B30" stroke="#333" stroke-width="2"/>
  <!-- Apple highlight -->
  <ellipse cx="25" cy="14" rx="3" ry="4" fill="white" opacity="0.3"/>
  <!-- Apple stem -->
  <line x1="30" y1="6" x2="32" y2="2" stroke="#5D4037" stroke-width="2" stroke-linecap="round"/>
  <!-- Apple leaf -->
  <ellipse cx="34" cy="6" rx="4" ry="2" fill="#4CAF50" stroke="#333" stroke-width="1" transform="rotate(-20 34 6)"/>
  <!-- Apple bottom indent -->
  <path d="M26 28 Q30 26 34 28" stroke="#D32F2F" stroke-width="1" fill="none" opacity="0.5"/>
</svg>
