<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60">
  <!-- 四色记忆块（与游戏内音块同色） -->
  <rect x="10" y="10" width="18" height="18" rx="4" fill="#FF6B6B" stroke="#333" stroke-width="2"/>
  <rect x="32" y="10" width="18" height="18" rx="4" fill="#FFE66D" stroke="#333" stroke-width="2"/>
  <rect x="10" y="32" width="18" height="18" rx="4" fill="#4ECDC4" stroke="#333" stroke-width="2"/>
  <rect x="32" y="32" width="18" height="18" rx="4" fill="#95E1D3" stroke="#333" stroke-width="2"/>
  <!-- 点亮效果：左上块提亮 + 白色描边（对应游戏内灯光） -->
  <rect x="10" y="10" width="18" height="18" rx="4" fill="#FF8787" stroke="#fff" stroke-width="2.5"/>
  <!-- 音符 -->
  <path d="M 40 48 L 40 37 Q 45 38 46 34" fill="none" stroke="#333" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="38.5" cy="49" r="3" fill="#333"/>
</svg>
