<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60">
  <!-- 小怪兽身体 -->
  <ellipse cx="30" cy="36" rx="20" ry="18" fill="#43C59E" stroke="#333" stroke-width="2"/>
  <!-- 触角 -->
  <line x1="20" y1="20" x2="15" y2="10" stroke="#333" stroke-width="2"/>
  <circle cx="14" cy="8" r="3.5" fill="#FFE66D" stroke="#333" stroke-width="1.5"/>
  <line x1="40" y1="20" x2="45" y2="10" stroke="#333" stroke-width="2"/>
  <circle cx="46" cy="8" r="3.5" fill="#FFE66D" stroke="#333" stroke-width="1.5"/>
  <!-- 眼睛 -->
  <circle cx="23" cy="32" r="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <circle cx="37" cy="32" r="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <circle cx="24" cy="33" r="2.5" fill="#333"/>
  <circle cx="36" cy="33" r="2.5" fill="#333"/>
  <!-- 微笑 -->
  <path d="M 24 44 Q 30 49 36 44" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <!-- 数字与苹果 -->
  <text x="12" y="18" font-size="11" font-weight="bold" fill="#FF6B6B" stroke="#333" stroke-width="0.5">1</text>
  <text x="46" y="42" font-size="11" font-weight="bold" fill="#667eea" stroke="#333" stroke-width="0.5">2</text>
  <text x="8" y="50" font-size="10" font-weight="bold" fill="#FF9F43" stroke="#333" stroke-width="0.5">3</text>
  <!-- 苹果 -->
  <circle cx="50" cy="20" r="5" fill="#FF6B6B" stroke="#333" stroke-width="1.5"/>
  <line x1="50" y1="15" x2="50" y2="12" stroke="#5D3A1A" stroke-width="1.5"/>
</svg>
