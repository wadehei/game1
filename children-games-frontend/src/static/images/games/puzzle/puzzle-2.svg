<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <!-- Ocean water background -->
  <rect width="300" height="300" fill="#1E88E5" rx="8"/>
  <!-- Water gradient layers -->
  <rect y="0" width="300" height="80" fill="#42A5F5" rx="8"/>
  <rect y="60" width="300" height="40" fill="#2196F3" opacity="0.5"/>
  <!-- Waves at top -->
  <path d="M0 50 Q30 35 60 50 Q90 65 120 50 Q150 35 180 50 Q210 65 240 50 Q270 35 300 50 L300 70 Q270 55 240 70 Q210 85 180 70 Q150 55 120 70 Q90 85 60 70 Q30 55 0 70 Z" fill="#64B5F6" opacity="0.6"/>
  <!-- Bubbles -->
  <circle cx="50" cy="60" r="4" fill="none" stroke="#BBDEFB" stroke-width="1.5" opacity="0.7"/>
  <circle cx="120" cy="40" r="3" fill="none" stroke="#BBDEFB" stroke-width="1.5" opacity="0.7"/>
  <circle cx="200" cy="55" r="5" fill="none" stroke="#BBDEFB" stroke-width="1.5" opacity="0.7"/>
  <circle cx="260" cy="45" r="3" fill="none" stroke="#BBDEFB" stroke-width="1.5" opacity="0.7"/>
  <circle cx="80" cy="80" r="3.5" fill="none" stroke="#BBDEFB" stroke-width="1.5" opacity="0.5"/>
  <circle cx="170" cy="75" r="4" fill="none" stroke="#BBDEFB" stroke-width="1.5" opacity="0.5"/>
  <!-- Sandy bottom -->
  <ellipse cx="150" cy="310" rx="180" ry="40" fill="#FFE0B2"/>
  <!-- Pink coral -->
  <g transform="translate(60, 230)">
    <path d="M0 50 Q-5 30 -15 15 Q-18 5 -10 10 Q-5 15 0 20 Q5 15 10 10 Q18 5 15 15 Q5 30 0 50" fill="#FF6B9D" stroke="#333" stroke-width="1.5"/>
    <path d="M0 35 Q-8 20 -20 25" fill="none" stroke="#FF6B9D" stroke-width="3" stroke-linecap="round"/>
    <path d="M0 35 Q8 20 20 25" fill="none" stroke="#FF6B9D" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-18" cy="12" r="4" fill="#FF85B5"/>
    <circle cx="18" cy="12" r="4" fill="#FF85B5"/>
    <circle cx="-10" cy="8" r="3" fill="#FF85B5"/>
    <circle cx="10" cy="8" r="3" fill="#FF85B5"/>
  </g>
  <!-- Green seaweed -->
  <path d="M220 280 Q215 260 220 240 Q225 220 218 200 Q215 190 220 180" fill="none" stroke="#4CAF50" stroke-width="5" stroke-linecap="round"/>
  <path d="M230 280 Q235 255 228 235 Q225 220 232 200" fill="none" stroke="#66BB6A" stroke-width="4" stroke-linecap="round"/>
  <path d="M240 280 Q238 265 242 250 Q245 235 240 220" fill="none" stroke="#43A047" stroke-width="4" stroke-linecap="round"/>
  <!-- Yellow starfish -->
  <g transform="translate(160, 260)">
    <polygon points="0,-18 5,-6 18,-6 8,3 12,16 0,8 -12,16 -8,3 -18,-6 -5,-6" fill="#FFD700" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="4" fill="#FFC107"/>
    <circle cx="-3" cy="-3" r="1.5" fill="#333"/>
    <circle cx="3" cy="-3" r="1.5" fill="#333"/>
    <path d="M-2 2 Q0 5 2 2" fill="none" stroke="#333" stroke-width="1" stroke-linecap="round"/>
  </g>
  <!-- Orange fish -->
  <g transform="translate(80, 130)">
    <ellipse cx="0" cy="0" rx="22" ry="14" fill="#FF8C00" stroke="#333" stroke-width="2"/>
    <polygon points="20,-2 32,-12 32,12 20,2" fill="#FF8C00" stroke="#333" stroke-width="1.5"/>
    <circle cx="-8" cy="-3" r="4" fill="#fff" stroke="#333" stroke-width="1"/>
    <circle cx="-7" cy="-3" r="2" fill="#333"/>
    <path d="M-14 4 Q-10 7 -6 4" fill="none" stroke="#333" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M2 -8 Q6 -12 10 -8" fill="none" stroke="#FFB366" stroke-width="1.5"/>
    <path d="M4 -4 Q8 -7 12 -4" fill="none" stroke="#FFB366" stroke-width="1.5"/>
  </g>
  <!-- Yellow fish -->
  <g transform="translate(200, 160)">
    <ellipse cx="0" cy="0" rx="18" ry="12" fill="#FFD700" stroke="#333" stroke-width="2"/>
    <polygon points="16,-2 26,-10 26,10 16,2" fill="#FFD700" stroke="#333" stroke-width="1.5"/>
    <circle cx="-6" cy="-2" r="3.5" fill="#fff" stroke="#333" stroke-width="1"/>
    <circle cx="-5" cy="-2" r="1.8" fill="#333"/>
    <path d="M-12 3 Q-8 6 -4 3" fill="none" stroke="#333" stroke-width="1.2" stroke-linecap="round"/>
  </g>
  <!-- Blue fish -->
  <g transform="translate(140, 200)">
    <ellipse cx="0" cy="0" rx="20" ry="13" fill="#42A5F5" stroke="#333" stroke-width="2"/>
    <polygon points="18,-2 30,-11 30,11 18,2" fill="#42A5F5" stroke="#333" stroke-width="1.5"/>
    <circle cx="-7" cy="-3" r="4" fill="#fff" stroke="#333" stroke-width="1"/>
    <circle cx="-6" cy="-3" r="2" fill="#333"/>
    <path d="M-13 3 Q-9 6 -5 3" fill="none" stroke="#333" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M0 -7 Q4 -10 8 -7" fill="none" stroke="#1E88E5" stroke-width="1.5"/>
  </g>
  <!-- Small bubbles near fish -->
  <circle cx="60" cy="115" r="2.5" fill="none" stroke="#BBDEFB" stroke-width="1"/>
  <circle cx="55" cy="105" r="2" fill="none" stroke="#BBDEFB" stroke-width="1"/>
  <circle cx="185" cy="148" r="2" fill="none" stroke="#BBDEFB" stroke-width="1"/>
  <circle cx="125" cy="190" r="2.5" fill="none" stroke="#BBDEFB" stroke-width="1"/>
</svg>
