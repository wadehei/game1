<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 80">
  <!-- Left track -->
  <rect x="1" y="28" width="13" height="44" rx="6" fill="#2E4E8E" stroke="#333" stroke-width="2"/>
  <rect x="3" y="34" width="9" height="5" rx="2" fill="#4169E1" opacity="0.5"/>
  <rect x="3" y="44" width="9" height="5" rx="2" fill="#4169E1" opacity="0.5"/>
  <rect x="3" y="54" width="9" height="5" rx="2" fill="#4169E1" opacity="0.5"/>
  <!-- Right track -->
  <rect x="46" y="28" width="13" height="44" rx="6" fill="#2E4E8E" stroke="#333" stroke-width="2"/>
  <rect x="48" y="34" width="9" height="5" rx="2" fill="#4169E1" opacity="0.5"/>
  <rect x="48" y="44" width="9" height="5" rx="2" fill="#4169E1" opacity="0.5"/>
  <rect x="48" y="54" width="9" height="5" rx="2" fill="#4169E1" opacity="0.5"/>
  <!-- Body -->
  <rect x="9" y="30" width="42" height="40" rx="8" fill="#4169E1" stroke="#333" stroke-width="2"/>
  <!-- Body highlights -->
  <rect x="13" y="34" width="34" height="5" rx="2" fill="#6CA6FF" opacity="0.6"/>
  <rect x="13" y="42" width="34" height="3" rx="1" fill="#6CA6FF" opacity="0.3"/>
  <!-- Cannon barrel -->
  <rect x="25" y="4" width="10" height="28" rx="4" fill="#3158C8" stroke="#333" stroke-width="2"/>
  <circle cx="30" cy="5" r="4.5" fill="#2E4E8E" stroke="#333" stroke-width="1.5"/>
  <circle cx="30" cy="5" r="2" fill="#1E3A7A"/>
  <!-- Turret -->
  <circle cx="30" cy="35" r="14" fill="#1E90FF" stroke="#333" stroke-width="2"/>
  <!-- Eyes -->
  <ellipse cx="24" cy="32" rx="3.5" ry="4" fill="white"/>
  <circle cx="25" cy="33" r="2" fill="#333"/>
  <circle cx="25.5" cy="32" r="0.8" fill="white"/>
  <ellipse cx="36" cy="32" rx="3.5" ry="4" fill="white"/>
  <circle cx="37" cy="33" r="2" fill="#333"/>
  <circle cx="37.5" cy="32" r="0.8" fill="white"/>
  <!-- Smile -->
  <path d="M25 39 Q30 44 35 39" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
