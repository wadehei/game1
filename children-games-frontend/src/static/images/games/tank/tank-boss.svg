<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 100">
  <!-- Left track -->
  <rect x="2" y="30" width="16" height="58" rx="7" fill="#2D2040" stroke="#333" stroke-width="2"/>
  <rect x="4" y="38" width="12" height="6" rx="2" fill="#483D6B" opacity="0.5"/>
  <rect x="4" y="50" width="12" height="6" rx="2" fill="#483D6B" opacity="0.5"/>
  <rect x="4" y="62" width="12" height="6" rx="2" fill="#483D6B" opacity="0.5"/>
  <rect x="4" y="74" width="12" height="6" rx="2" fill="#483D6B" opacity="0.5"/>
  <!-- Right track -->
  <rect x="62" y="30" width="16" height="58" rx="7" fill="#2D2040" stroke="#333" stroke-width="2"/>
  <rect x="64" y="38" width="12" height="6" rx="2" fill="#483D6B" opacity="0.5"/>
  <rect x="64" y="50" width="12" height="6" rx="2" fill="#483D6B" opacity="0.5"/>
  <rect x="64" y="62" width="12" height="6" rx="2" fill="#483D6B" opacity="0.5"/>
  <rect x="64" y="74" width="12" height="6" rx="2" fill="#483D6B" opacity="0.5"/>
  <!-- Body -->
  <rect x="12" y="32" width="56" height="52" rx="8" fill="#3D3356" stroke="#333" stroke-width="2.5"/>
  <!-- Armor plates -->
  <rect x="16" y="36" width="14" height="10" rx="3" fill="#483D6B" stroke="#333" stroke-width="1"/>
  <rect x="50" y="36" width="14" height="10" rx="3" fill="#483D6B" stroke="#333" stroke-width="1"/>
  <rect x="16" y="50" width="14" height="10" rx="3" fill="#483D6B" stroke="#333" stroke-width="1"/>
  <rect x="50" y="50" width="14" height="10" rx="3" fill="#483D6B" stroke="#333" stroke-width="1"/>
  <rect x="16" y="64" width="14" height="10" rx="3" fill="#483D6B" stroke="#333" stroke-width="1"/>
  <rect x="50" y="64" width="14" height="10" rx="3" fill="#483D6B" stroke="#333" stroke-width="1"/>
  <!-- Spikes left -->
  <polygon points="12,38 4,43 12,48" fill="#5A4D7A" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="12,54 4,59 12,64" fill="#5A4D7A" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="12,70 4,75 12,80" fill="#5A4D7A" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Spikes right -->
  <polygon points="68,38 76,43 68,48" fill="#5A4D7A" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="68,54 76,59 68,64" fill="#5A4D7A" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="68,70 76,75 68,80" fill="#5A4D7A" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Cannon barrel (large) -->
  <rect x="32" y="2" width="16" height="38" rx="5" fill="#2D2040" stroke="#333" stroke-width="2.5"/>
  <circle cx="40" cy="5" r="6" fill="#2D2040" stroke="#333" stroke-width="2"/>
  <circle cx="40" cy="5" r="3" fill="#1A1028"/>
  <!-- Muzzle glow -->
  <circle cx="40" cy="5" r="2" fill="#FF4444" opacity="0.6"/>
  <!-- Turret -->
  <circle cx="40" cy="40" r="18" fill="#4D4169" stroke="#333" stroke-width="2.5"/>
  <!-- Red glowing eyes -->
  <ellipse cx="33" cy="37" rx="4" ry="5" fill="#FF0000" opacity="0.4"/>
  <ellipse cx="33" cy="37" rx="3" ry="3.5" fill="#FF0000" opacity="0.8"/>
  <ellipse cx="33" cy="37" rx="1.5" ry="2" fill="#FF6666"/>
  <ellipse cx="47" cy="37" rx="4" ry="5" fill="#FF0000" opacity="0.4"/>
  <ellipse cx="47" cy="37" rx="3" ry="3.5" fill="#FF0000" opacity="0.8"/>
  <ellipse cx="47" cy="37" rx="1.5" ry="2" fill="#FF6666"/>
  <!-- Scary mouth -->
  <path d="M33 47 L37 43 L40 47 L43 43 L47 47" stroke="#FF4444" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Center bolt -->
  <circle cx="40" cy="55" r="3" fill="#5A4D7A" stroke="#333" stroke-width="1"/>
</svg>
