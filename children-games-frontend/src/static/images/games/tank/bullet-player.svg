<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
  <!-- Glow effect -->
  <circle cx="10" cy="9" r="8" fill="#FFD700" opacity="0.2"/>
  <circle cx="10" cy="9" r="6" fill="#FFD700" opacity="0.15"/>
  <!-- Left wing fin -->
  <path d="M5 12 L2 15 L5 17" fill="#FFC107" stroke="#B8860B" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Right wing fin -->
  <path d="M15 12 L18 15 L15 17" fill="#FFC107" stroke="#B8860B" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Main body -->
  <ellipse cx="10" cy="9" rx="4.5" ry="5.5" fill="#FFD700" stroke="#B8860B" stroke-width="1.5"/>
  <!-- Pointed top -->
  <path d="M7 6 L10 1 L13 6" fill="#FFD700" stroke="#B8860B" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Highlight -->
  <ellipse cx="8" cy="7" rx="1.5" ry="2.5" fill="white" opacity="0.45"/>
  <!-- Bottom glow -->
  <circle cx="10" cy="16" r="2" fill="#FFD700" opacity="0.3"/>
</svg>
