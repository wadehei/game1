<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Base green background -->
  <rect width="100" height="100" fill="#4CAF50"/>
  <!-- Subtle texture variation -->
  <rect x="0" y="0" width="50" height="50" fill="#43A047" opacity="0.3"/>
  <rect x="50" y="50" width="50" height="50" fill="#66BB6A" opacity="0.3"/>
  <!-- Grass blades (darker green strokes) -->
  <line x1="10" y1="20" x2="9" y2="12" stroke="#388E3C" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="35" y1="55" x2="36" y2="47" stroke="#388E3C" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="60" y1="25" x2="58" y2="17" stroke="#2E7D32" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="80" y1="70" x2="82" y2="62" stroke="#388E3C" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="25" y1="80" x2="23" y2="72" stroke="#2E7D32" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="10" x2="52" y2="3" stroke="#388E3C" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="90" y1="45" x2="88" y2="37" stroke="#2E7D32" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="15" y1="50" x2="17" y2="43" stroke="#388E3C" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="70" y1="90" x2="68" y2="83" stroke="#2E7D32" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="45" y1="75" x2="47" y2="68" stroke="#388E3C" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Yellow flowers -->
  <circle cx="20" cy="35" r="2.5" fill="#FFD700"/>
  <circle cx="20" cy="35" r="1" fill="#FFF176"/>
  <circle cx="75" cy="15" r="2.5" fill="#FFD700"/>
  <circle cx="75" cy="15" r="1" fill="#FFF176"/>
  <circle cx="55" cy="85" r="2.5" fill="#FFD700"/>
  <circle cx="55" cy="85" r="1" fill="#FFF176"/>
  <!-- White flowers -->
  <circle cx="45" cy="45" r="2" fill="white" opacity="0.85"/>
  <circle cx="45" cy="45" r="0.8" fill="#FFF9C4"/>
  <circle cx="88" cy="82" r="2" fill="white" opacity="0.85"/>
  <circle cx="88" cy="82" r="0.8" fill="#FFF9C4"/>
  <!-- Pink flowers -->
  <circle cx="12" cy="70" r="2.5" fill="#FF80AB"/>
  <circle cx="12" cy="70" r="1" fill="#FFB2DD"/>
  <circle cx="65" cy="55" r="2.5" fill="#FF80AB"/>
  <circle cx="65" cy="55" r="1" fill="#FFB2DD"/>
</svg>
