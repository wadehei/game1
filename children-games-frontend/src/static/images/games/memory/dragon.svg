<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- Small wings on sides -->
  <path d="M8 40 Q2 30 8 24 Q14 20 18 28 Q16 34 14 40 Z" fill="#66BB6A" stroke="#333" stroke-width="1.5"/>
  <path d="M72 40 Q78 30 72 24 Q66 20 62 28 Q64 34 66 40 Z" fill="#66BB6A" stroke="#333" stroke-width="1.5"/>
  <!-- Wing details -->
  <path d="M10 36 Q8 30 12 26" fill="none" stroke="#4CAF50" stroke-width="1"/>
  <path d="M70 36 Q72 30 68 26" fill="none" stroke="#4CAF50" stroke-width="1"/>
  <!-- Small horns/spikes -->
  <ellipse cx="30" cy="14" rx="3" ry="6" fill="#4CAF50" stroke="#333" stroke-width="1.5" transform="rotate(-10 30 14)"/>
  <ellipse cx="40" cy="10" rx="3" ry="7" fill="#4CAF50" stroke="#333" stroke-width="1.5"/>
  <ellipse cx="50" cy="14" rx="3" ry="6" fill="#4CAF50" stroke="#333" stroke-width="1.5" transform="rotate(10 50 14)"/>
  <!-- Head - green -->
  <circle cx="40" cy="42" r="26" fill="#66BB6A" stroke="#333" stroke-width="2"/>
  <!-- Lighter belly/face area -->
  <ellipse cx="40" cy="50" rx="14" ry="12" fill="#A5D6A7"/>
  <!-- Big round eyes -->
  <circle cx="30" cy="38" r="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <circle cx="50" cy="38" r="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <circle cx="31" cy="38" r="3.5" fill="#333"/>
  <circle cx="51" cy="38" r="3.5" fill="#333"/>
  <circle cx="32" cy="37" r="1.5" fill="#fff"/>
  <circle cx="52" cy="37" r="1.5" fill="#fff"/>
  <!-- Nostrils -->
  <circle cx="37" cy="48" r="1.5" fill="#388E3C"/>
  <circle cx="43" cy="48" r="1.5" fill="#388E3C"/>
  <!-- Cute smile -->
  <path d="M34 53 Q40 58 46 53" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Cute little flame puff -->
  <path d="M60 56 Q66 50 64 44 Q68 48 66 54 Q70 50 68 56 Q66 60 62 58 Z" fill="#FF6B00" stroke="#333" stroke-width="1"/>
  <path d="M62 56 Q66 52 64 48" fill="none" stroke="#FFD700" stroke-width="1.5"/>
  <!-- Cheeks -->
  <circle cx="20" cy="46" r="4" fill="#81C784" opacity="0.5"/>
  <circle cx="60" cy="46" r="4" fill="#81C784" opacity="0.5"/>
</svg>
