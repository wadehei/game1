<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- Round black ears -->
  <circle cx="20" cy="22" r="12" fill="#333" stroke="#333" stroke-width="2"/>
  <circle cx="60" cy="22" r="12" fill="#333" stroke="#333" stroke-width="2"/>
  <!-- Inner ear -->
  <circle cx="20" cy="22" r="6" fill="#555"/>
  <circle cx="60" cy="22" r="6" fill="#555"/>
  <!-- Head - white -->
  <circle cx="40" cy="42" r="26" fill="#fff" stroke="#333" stroke-width="2"/>
  <!-- Black eye patches -->
  <ellipse cx="29" cy="38" rx="10" ry="11" fill="#333"/>
  <ellipse cx="51" cy="38" rx="10" ry="11" fill="#333"/>
  <!-- Eyes - white with cute look -->
  <circle cx="29" cy="37" r="5" fill="#fff"/>
  <circle cx="51" cy="37" r="5" fill="#fff"/>
  <circle cx="30" cy="37" r="3" fill="#333"/>
  <circle cx="52" cy="37" r="3" fill="#333"/>
  <circle cx="31" cy="36" r="1.2" fill="#fff"/>
  <circle cx="53" cy="36" r="1.2" fill="#fff"/>
  <!-- Nose -->
  <ellipse cx="40" cy="48" rx="3.5" ry="2.5" fill="#333"/>
  <!-- Cute smile -->
  <path d="M34 52 Q37 56 40 52 Q43 56 46 52" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Cheeks -->
  <circle cx="22" cy="48" r="4" fill="#FFB5B5" opacity="0.4"/>
  <circle cx="58" cy="48" r="4" fill="#FFB5B5" opacity="0.4"/>
</svg>
