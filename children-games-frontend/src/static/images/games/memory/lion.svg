<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- 鬃毛：围绕头部的圆形花瓣，读感为"狮子"而非太阳 -->
  <g fill="#D35400" stroke="#333" stroke-width="2">
    <circle cx="40" cy="10" r="9"/>
    <circle cx="61" cy="17" r="9"/>
    <circle cx="70" cy="38" r="9"/>
    <circle cx="64" cy="60" r="9"/>
    <circle cx="47" cy="70" r="9"/>
    <circle cx="26" cy="66" r="9"/>
    <circle cx="14" cy="47" r="9"/>
    <circle cx="17" cy="24" r="9"/>
  </g>
  <circle cx="40" cy="40" r="30" fill="#D35400" stroke="#333" stroke-width="2"/>
  <!-- 脸 -->
  <circle cx="40" cy="42" r="24" fill="#F5CBA7" stroke="#333" stroke-width="2"/>
  <!-- 耳朵 -->
  <circle cx="24" cy="22" r="6" fill="#F5CBA7" stroke="#333" stroke-width="2"/>
  <circle cx="56" cy="22" r="6" fill="#F5CBA7" stroke="#333" stroke-width="2"/>
  <!-- 眼睛 -->
  <circle cx="32" cy="38" r="3" fill="#333"/>
  <circle cx="48" cy="38" r="3" fill="#333"/>
  <circle cx="33" cy="37" r="1" fill="#fff"/>
  <circle cx="49" cy="37" r="1" fill="#fff"/>
  <!-- 口鼻 -->
  <ellipse cx="40" cy="50" rx="11" ry="8.5" fill="#FFF3E0" stroke="#333" stroke-width="1.8"/>
  <ellipse cx="40" cy="46.5" rx="3.5" ry="2.5" fill="#333"/>
  <path d="M 40 49 L 40 52 M 40 52 Q 36 55 33 52.5 M 40 52 Q 44 55 47 52.5" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round"/>
  <!-- 胡须点 -->
  <circle cx="31" cy="50" r="1" fill="#333"/>
  <circle cx="49" cy="50" r="1" fill="#333"/>
</svg>
