<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- Long ears standing up -->
  <ellipse cx="26" cy="16" rx="8" ry="20" fill="#fff" stroke="#333" stroke-width="2"/>
  <ellipse cx="54" cy="16" rx="8" ry="20" fill="#fff" stroke="#333" stroke-width="2"/>
  <!-- Pink inner ears -->
  <ellipse cx="26" cy="16" rx="5" ry="14" fill="#FFB6C1"/>
  <ellipse cx="54" cy="16" rx="5" ry="14" fill="#FFB6C1"/>
  <!-- Head - white -->
  <circle cx="40" cy="44" r="24" fill="#fff" stroke="#333" stroke-width="2"/>
  <!-- Eyes -->
  <circle cx="30" cy="40" r="5" fill="#333"/>
  <circle cx="50" cy="40" r="5" fill="#333"/>
  <circle cx="31.5" cy="38.5" r="2" fill="#fff"/>
  <circle cx="51.5" cy="38.5" r="2" fill="#fff"/>
  <!-- Pink nose -->
  <ellipse cx="40" cy="48" rx="3.5" ry="2.5" fill="#FF8899"/>
  <!-- Mouth -->
  <path d="M36 52 Q40 56 44 52" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Whisker dots -->
  <circle cx="32" cy="50" r="1" fill="#ccc"/>
  <circle cx="34" cy="52" r="1" fill="#ccc"/>
  <circle cx="46" cy="52" r="1" fill="#ccc"/>
  <circle cx="48" cy="50" r="1" fill="#ccc"/>
  <!-- Cheeks -->
  <circle cx="22" cy="48" r="4" fill="#FFB5B5" opacity="0.4"/>
  <circle cx="58" cy="48" r="4" fill="#FFB5B5" opacity="0.4"/>
</svg>
