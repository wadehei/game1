<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- Small ears -->
  <ellipse cx="18" cy="24" rx="8" ry="10" fill="#FFB6C1" stroke="#333" stroke-width="2" transform="rotate(-15 18 24)"/>
  <ellipse cx="62" cy="24" rx="8" ry="10" fill="#FFB6C1" stroke="#333" stroke-width="2" transform="rotate(15 62 24)"/>
  <ellipse cx="18" cy="24" rx="5" ry="6" fill="#FF8FAA" transform="rotate(-15 18 24)"/>
  <ellipse cx="62" cy="24" rx="5" ry="6" fill="#FF8FAA" transform="rotate(15 62 24)"/>
  <!-- Head - pink round -->
  <circle cx="40" cy="42" r="26" fill="#FFB6C1" stroke="#333" stroke-width="2"/>
  <!-- Big round snout -->
  <ellipse cx="40" cy="50" rx="14" ry="10" fill="#FF8FAA" stroke="#333" stroke-width="1.5"/>
  <!-- Nostrils -->
  <circle cx="35" cy="50" r="3" fill="#D16B7A"/>
  <circle cx="45" cy="50" r="3" fill="#D16B7A"/>
  <!-- Eyes -->
  <circle cx="30" cy="36" r="4.5" fill="#333"/>
  <circle cx="50" cy="36" r="4.5" fill="#333"/>
  <circle cx="31.5" cy="34.5" r="1.8" fill="#fff"/>
  <circle cx="51.5" cy="34.5" r="1.8" fill="#fff"/>
  <!-- Cheeks -->
  <circle cx="20" cy="44" r="4" fill="#FF8FAA" opacity="0.5"/>
  <circle cx="60" cy="44" r="4" fill="#FF8FAA" opacity="0.5"/>
</svg>
