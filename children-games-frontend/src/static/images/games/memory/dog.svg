<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- Floppy ears -->
  <ellipse cx="22" cy="28" rx="12" ry="18" fill="#8B5E3C" stroke="#333" stroke-width="2" transform="rotate(-15 22 28)"/>
  <ellipse cx="58" cy="28" rx="12" ry="18" fill="#8B5E3C" stroke="#333" stroke-width="2" transform="rotate(15 58 28)"/>
  <!-- Inner ears -->
  <ellipse cx="22" cy="30" rx="7" ry="11" fill="#C4956A" transform="rotate(-15 22 30)"/>
  <ellipse cx="58" cy="30" rx="7" ry="11" fill="#C4956A" transform="rotate(15 58 30)"/>
  <!-- Head -->
  <circle cx="40" cy="42" r="26" fill="#C4956A" stroke="#333" stroke-width="2"/>
  <!-- Face lighter area -->
  <ellipse cx="40" cy="50" rx="16" ry="14" fill="#E8C9A0"/>
  <!-- Eyes -->
  <circle cx="31" cy="38" r="5" fill="#333"/>
  <circle cx="49" cy="38" r="5" fill="#333"/>
  <circle cx="33" cy="36" r="2" fill="#fff"/>
  <circle cx="51" cy="36" r="2" fill="#fff"/>
  <!-- Nose -->
  <ellipse cx="40" cy="48" rx="5" ry="3.5" fill="#333"/>
  <ellipse cx="40" cy="47" rx="2" ry="1" fill="#666"/>
  <!-- Mouth -->
  <path d="M36 52 Q40 58 44 52" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Tongue -->
  <ellipse cx="40" cy="57" rx="4" ry="5" fill="#FF6B8A" stroke="#333" stroke-width="1.5"/>
  <line x1="40" y1="54" x2="40" y2="60" stroke="#E05577" stroke-width="1"/>
  <!-- Cheeks -->
  <circle cx="24" cy="48" r="4" fill="#FFB5B5" opacity="0.5"/>
  <circle cx="56" cy="48" r="4" fill="#FFB5B5" opacity="0.5"/>
</svg>
