<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- Round ears -->
  <circle cx="16" cy="30" r="11" fill="#8B5E3C" stroke="#333" stroke-width="2"/>
  <circle cx="64" cy="30" r="11" fill="#8B5E3C" stroke="#333" stroke-width="2"/>
  <!-- Inner ears -->
  <circle cx="16" cy="30" r="7" fill="#C4956A"/>
  <circle cx="64" cy="30" r="7" fill="#C4956A"/>
  <!-- Head - brown -->
  <circle cx="40" cy="42" r="26" fill="#8B5E3C" stroke="#333" stroke-width="2"/>
  <!-- Light tan face area -->
  <ellipse cx="40" cy="48" rx="18" ry="16" fill="#DEB887"/>
  <!-- Eyes -->
  <circle cx="30" cy="38" r="5" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <circle cx="50" cy="38" r="5" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <circle cx="31" cy="38" r="3" fill="#333"/>
  <circle cx="51" cy="38" r="3" fill="#333"/>
  <circle cx="32" cy="37" r="1.2" fill="#fff"/>
  <circle cx="52" cy="37" r="1.2" fill="#fff"/>
  <!-- Nose -->
  <ellipse cx="40" cy="48" rx="4" ry="2.5" fill="#5D3A1A"/>
  <!-- Smile -->
  <path d="M33 53 Q40 60 47 53" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Cheeks -->
  <circle cx="22" cy="48" r="4" fill="#FFB5B5" opacity="0.4"/>
  <circle cx="58" cy="48" r="4" fill="#FFB5B5" opacity="0.4"/>
</svg>
