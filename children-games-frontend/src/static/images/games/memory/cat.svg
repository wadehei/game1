<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- Pointy ears -->
  <polygon points="18,30 26,8 34,30" fill="#FF9933" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="46,30 54,8 62,30" fill="#FF9933" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- Inner ears -->
  <polygon points="22,28 26,14 30,28" fill="#FFB366" stroke="none"/>
  <polygon points="50,28 54,14 58,28" fill="#FFB366" stroke="none"/>
  <!-- Head -->
  <circle cx="40" cy="42" r="26" fill="#FF9933" stroke="#333" stroke-width="2"/>
  <!-- Stripes on forehead -->
  <path d="M32 22 L36 30" stroke="#CC6600" stroke-width="2" stroke-linecap="round"/>
  <path d="M40 20 L40 28" stroke="#CC6600" stroke-width="2" stroke-linecap="round"/>
  <path d="M48 22 L44 30" stroke="#CC6600" stroke-width="2" stroke-linecap="round"/>
  <!-- Face white area -->
  <ellipse cx="40" cy="50" rx="16" ry="13" fill="#FFEEDD"/>
  <!-- Eyes - green -->
  <ellipse cx="31" cy="38" rx="5.5" ry="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <ellipse cx="49" cy="38" rx="5.5" ry="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <circle cx="31" cy="39" r="3.5" fill="#33CC33"/>
  <circle cx="49" cy="39" r="3.5" fill="#33CC33"/>
  <circle cx="31" cy="39" r="2" fill="#333"/>
  <circle cx="49" cy="39" r="2" fill="#333"/>
  <circle cx="32.5" cy="37.5" r="1.2" fill="#fff"/>
  <circle cx="50.5" cy="37.5" r="1.2" fill="#fff"/>
  <!-- Nose - pink -->
  <ellipse cx="40" cy="48" rx="4" ry="3" fill="#FF8899"/>
  <!-- Mouth -->
  <path d="M36 51 Q40 56 44 51" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Whiskers -->
  <line x1="10" y1="44" x2="26" y2="47" stroke="#333" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="10" y1="50" x2="26" y2="50" stroke="#333" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="10" y1="56" x2="26" y2="53" stroke="#333" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="70" y1="44" x2="54" y2="47" stroke="#333" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="70" y1="50" x2="54" y2="50" stroke="#333" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="70" y1="56" x2="54" y2="53" stroke="#333" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Cheeks -->
  <circle cx="24" cy="50" r="4" fill="#FFB5B5" opacity="0.4"/>
  <circle cx="56" cy="50" r="4" fill="#FFB5B5" opacity="0.4"/>
</svg>
