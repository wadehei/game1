<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- Red comb on top -->
  <circle cx="32" cy="14" r="6" fill="#FF3333" stroke="#333" stroke-width="1.5"/>
  <circle cx="40" cy="10" r="7" fill="#FF3333" stroke="#333" stroke-width="1.5"/>
  <circle cx="48" cy="14" r="6" fill="#FF3333" stroke="#333" stroke-width="1.5"/>
  <!-- Head - yellow -->
  <circle cx="40" cy="42" r="26" fill="#FFD700" stroke="#333" stroke-width="2"/>
  <!-- Eyes -->
  <circle cx="30" cy="36" r="5" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <circle cx="50" cy="36" r="5" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <circle cx="31" cy="37" r="3" fill="#333"/>
  <circle cx="51" cy="37" r="3" fill="#333"/>
  <circle cx="32" cy="35.5" r="1.2" fill="#fff"/>
  <circle cx="52" cy="35.5" r="1.2" fill="#fff"/>
  <!-- Orange beak -->
  <polygon points="35,46 40,56 45,46" fill="#FF8C00" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Wattle (under beak) -->
  <ellipse cx="40" cy="58" rx="4" ry="5" fill="#FF3333" stroke="#333" stroke-width="1"/>
  <!-- Cheeks -->
  <circle cx="22" cy="44" r="5" fill="#FFAA00" opacity="0.4"/>
  <circle cx="58" cy="44" r="5" fill="#FFAA00" opacity="0.4"/>
</svg>
