# 儿童游戏乐园 - Nginx 安全头配置示例（未应用；生产缓存规则已在站点 conf 里，见 COMMANDS.md）
# 将此配置添加到 Nginx 的 server 块中；改完必须用宝塔二进制检查并重载：
#   /www/server/nginx/sbin/nginx -t && /www/server/nginx/sbin/nginx -s reload
# （注意：系统自带的 nginx 命令读的是 /etc/nginx/nginx.conf，不是宝塔的）

# 防止点击劫持
add_header X-Frame-Options "DENY" always;

# 防止 MIME 类型嗅探
add_header X-Content-Type-Options "nosniff" always;

# 控制引用信息泄露
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 权限策略（限制浏览器功能）
# 注意：microphone=(self) 必须保留——房间"按住说话"依赖 getUserMedia，
# 写成 microphone=() 会直接禁用语音功能（曾审查拦下）
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

# 内容安全策略（CSP）
# 站点无外部 CDN 资源（已排查 index.html 与全部源码），全部同源即可：
# - 脚本：Vite 产物 + index.html 内联脚本（需要 unsafe-inline；上 nonce 前先过 CSP 暂缓决策）
# - WebSocket：同源 /ws（'self' 已覆盖，不再放开 ws:/wss: 通配）
# - 语音 blob: 播放、头像 data: URL
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; media-src 'self' blob:;" always;

# HSTS 仅对 HTTPS 生效——当前入口是 http://49.232.231.35（纯 IP、无 TLS），
# 浏览器会忽略该头；等备案上 HTTPS 后再启用，且先低 max-age 灰度：
# add_header Strict-Transport-Security "max-age=300" always;

# 静态资源缓存（只写 expires——本块一旦出现 add_header 就不再继承 server 级
# 安全头；expires 1y 自带发出 Cache-Control: max-age=31536000）
location ^~ /assets/ {
    expires 1y;
}

# HTML 不缓存（nginx 正则 location：~* 忽略大小写；"location *.html" 不是合法语法永不匹配）
location ~* \.html$ {
    expires -1;
}
